<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300"><defs><clipPath id="c"><rect width="480" height="300" rx="14"/></clipPath></defs><g clip-path="url(#c)"><rect x="0" y="0" width="480" height="300" rx="14" fill="#f4f5f7"/><circle cx="18" cy="17" r="4.5" fill="#ff5f57"/><circle cx="33" cy="17" r="4.5" fill="#febc2e"/><circle cx="48" cy="17" r="4.5" fill="#28c840"/><text x="66" y="21" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#8a8f99" text-anchor="start" xml:space="preserve">Checked by another maker</text><rect x="10" y="34" width="460" height="256" rx="10" fill="#ffffff" stroke="#e4e6ea" stroke-width="1"/><circle cx="34" cy="56" r="8" fill="#1b1d22"/><circle cx="34" cy="56" r="2.6" fill="#7c5ce0"/><text x="48" y="60" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1b1d22" text-anchor="start" xml:space="preserve">Reviewer</text><text x="106.8" y="60" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8f99" text-anchor="start" xml:space="preserve">GPT Astra · checks Claude’s change</text><rect x="366.8" y="45" width="87.2" height="22" rx="11.0" fill="#f1f2f4"/><text x="410.40000000000003" y="59.6" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#1b1d22" text-anchor="middle" xml:space="preserve">Round 1 of 2</text><rect x="26" y="75" width="428" height="26" rx="8" fill="#f1f2f4"/><circle cx="42" cy="88" r="7" fill="#e8f6ee"/><path d="M39 88 l2.2 2.2 l4-4.4" fill="none" stroke="#1f9d55" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="92" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b1d22" text-anchor="start" xml:space="preserve">Does what was asked, and nothing that wasn’t</text><rect x="26" y="105" width="428" height="26" rx="8" fill="#f1f2f4"/><circle cx="42" cy="118" r="7" fill="#e8f6ee"/><path d="M39 118 l2.2 2.2 l4-4.4" fill="none" stroke="#1f9d55" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="122" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b1d22" text-anchor="start" xml:space="preserve">No bugs: edge cases, errors, races</text><rect x="26" y="135" width="428" height="26" rx="8" fill="#fdf4e6"/><circle cx="42" cy="148" r="7" fill="#fbe3c0"/><text x="42" y="151.5" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#de8a12" text-anchor="middle" xml:space="preserve">!</text><text x="56" y="152" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b1d22" text-anchor="start" xml:space="preserve">Tests cover the change</text><text x="446" y="152" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#de8a12" text-anchor="end" xml:space="preserve">back to the writer</text><rect x="26" y="165" width="428" height="26" rx="8" fill="#f1f2f4"/><circle cx="42" cy="178" r="7" fill="#e8f6ee"/><path d="M39 178 l2.2 2.2 l4-4.4" fill="none" stroke="#1f9d55" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="182" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b1d22" text-anchor="start" xml:space="preserve">No secrets or unsafe calls</text><rect x="26" y="195" width="428" height="26" rx="8" fill="#f1f2f4"/><circle cx="42" cy="208" r="7" fill="#e8f6ee"/><path d="M39 208 l2.2 2.2 l4-4.4" fill="none" stroke="#1f9d55" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="212" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b1d22" text-anchor="start" xml:space="preserve">Reads like the code around it</text><text x="26" y="260" font-family="Instrument Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8f99" text-anchor="start" xml:space="preserve">One finding goes back; the fix is checked again.</text></g><rect x="0.5" y="0.5" width="479" height="299" rx="13.5" fill="none" stroke="#e4e6ea" stroke-width="1"/></svg>