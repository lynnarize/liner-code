# Type check and tests on every push and pull request. macOS, because the engine's tests use
# codesign, sandbox-exec and ditto, and the desktop tests start Electron.
name: Check
on:
  push:
    branches: [main, design-and-api-endpoints]
  pull_request:
  workflow_dispatch:

# A pull request from a fork runs this file as the fork wrote it. pull_request (not
# pull_request_target) gives that run no secrets. The token only reads the repo; actions: write
# is so setup-node can save the npm cache.
permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # The job does not push. A test should not inherit a credential either.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The bundle users load: tsc alone misses import-graph, CSS and chunk failures.
      - run: npm run build
      # One file at a time: the timing tests fail at random under parallel load.
      - run: npm run test:steady -w engine
      - run: node desktop/build.ts
      - run: npm test -w desktop
