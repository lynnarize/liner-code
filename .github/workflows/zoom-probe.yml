# Throwaway: prints how a framed page is sized on the Mac runner, to find why browser-zoom.test.ts's transform case
# reads 0 wide there (CI run 44704625376). It never fails the build; delete it with .github/zoom-diag once read.
name: Zoom probe
on:
  push:
    branches: [design-and-api-endpoints]
    paths: [".github/zoom-diag/**", ".github/workflows/zoom-probe.yml", "desktop/test/browser-zoom*"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron's binary is fetched on first use, and its notice would land in the path below: fetch it first.
      - run: node node_modules/electron/install.js
      - run: '"$(node -e "console.log(require(\"electron\"))")" .github/zoom-diag/probe.cjs'
      - run: node desktop/build.ts
      # The zoom test on its own, then the whole desktop suite as Check runs it: which one fails says whether load matters.
      - run: node --test desktop/test/browser-zoom.test.ts
        continue-on-error: true
      - run: npm test -w desktop
        continue-on-error: true
