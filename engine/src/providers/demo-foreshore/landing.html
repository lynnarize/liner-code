<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foreshore, the launch page</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Newsreader:ital,opsz,wght@1,6..72,300..600&display=block">
<style>
/* Foreshore: the sample tide-tables app shown inside the Liner Design mockup.
   Concept: the day is drawn the way a sea chart draws a coast. Buff land above high water,
   green foreshore that dries, blue shallows, white deep water, magenta for marks.
   On a chart the names of water slope and the names of land stand upright: so do these. */
:root{
  --paper:#F7F8F5;--ink:#11181B;--muted:#56646A;--line:rgba(17,24,27,.16);
  --shallows:#BFE0EA;--foreshore:#B5D3A0;--land:#F0DA9C;--mark:#C4127A;--tint:rgba(240,218,156,.6);--on-mark:#fff
}
.night{
  --paper:#0C1315;--ink:#E7ECE8;--muted:#8C9B9E;--line:rgba(231,236,232,.2);
  --shallows:#143A4A;--foreshore:#27452E;--land:#463C1B;--mark:#FF5FB0;--tint:rgba(70,60,27,.75);--on-mark:#0C1315
}
*{box-sizing:border-box;margin:0}
body{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);font:400 15px/1.4 "Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-kerning:normal}
svg{display:block;overflow:visible}
svg text{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums}
.abs{position:absolute}
.sea{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-0.005em}
.fig{font-style:italic;font-stretch:62%;font-weight:800;letter-spacing:-0.015em;line-height:.8;white-space:nowrap}
.t{font-style:italic;font-stretch:80%;font-weight:700;letter-spacing:-0.01em}
.lab{font-size:11px;font-weight:600;font-stretch:125%;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.mut{color:var(--muted)}
.wm{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:650;font-stretch:112%;letter-spacing:-0.025em;white-space:nowrap}
.wm svg{width:26px;height:26px}
.flag{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 9px;background:var(--mark);color:var(--on-mark);font-size:12.5px;font-weight:600;white-space:nowrap}
.flag i{font-style:italic;font-weight:500;opacity:.92}
.tabs{left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:space-around;border-top:1px solid var(--line);background:var(--paper);font-size:14px;font-weight:500;color:var(--muted)}
.tabs b{font-weight:650;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:7px}
.row{display:flex;align-items:baseline;gap:12px;height:57px;padding:17px 16px 0;border-top:1px solid var(--line)}
.row .sea{width:128px;font-size:20px}
.row .t{font-size:26px}
.row .h{margin-left:auto;font-size:15px;color:var(--muted)}
.row.hi{background:var(--tint)}
</style>
<style>
body{width:1280px;height:800px}
.go{display:inline-grid;place-items:center;height:48px;padding:0 22px;border-radius:4px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:600}
.title{position:absolute;right:28px;top:28px;padding:12px 16px 13px;background:var(--paper);border:1px solid var(--ink);text-align:center;line-height:1.25}
</style>
</head>
<body>
<!-- The hero picture: a chart of the bay. In the mockup this is the layer a picture model made. -->
<svg class="abs" id="pic" style="left: 520px; top: 0" width="760" height="800" viewBox="0 0 390 410" preserveAspectRatio="xMidYMid slice">
  <rect x="-20" y="-60" width="440" height="600" fill="var(--paper)"/>
  <path d="M-10,150 C70,150 120,70 210,60 S340,40 400,-30 L400,500 L-10,500 Z" fill="var(--shallows)"/>
  <path d="M-10,262 C70,262 128,196 208,180 S336,150 400,84 L400,500 L-10,500 Z" fill="var(--foreshore)"/>
  <path d="M-10,352 C70,352 132,300 206,280 S332,244 400,186 L400,500 L-10,500 Z" fill="var(--land)"/>
  <g fill="none" stroke="var(--ink)">
    <path d="M-10,20 C60,24 100,-30 180,-44" stroke-width=".5" opacity=".3"/>
    <path d="M-10,78 C66,80 112,10 204,-6 S330,-30 400,-90" stroke-width=".5" opacity=".35"/>
    <path d="M-10,150 C70,150 120,70 210,60 S340,40 400,-30" stroke-width=".5" opacity=".5"/>
    <path d="M-10,206 C70,206 124,134 209,120 S338,95 400,27" stroke-width=".4" opacity=".3"/>
    <path d="M-10,262 C70,262 128,196 208,180 S336,150 400,84" stroke-width=".55" stroke-dasharray=".6 3" stroke-linecap="round" opacity=".75"/>
    <path d="M-10,352 C70,352 132,300 206,280 S332,244 400,186" stroke-width="1.3"/>
    <path d="M252,262 L196,150" stroke-width="2.8" stroke-linecap="square"/>
    <path d="M196,150 l-22,10" stroke-width="2.8" stroke-linecap="square"/>
    <path d="M40,410 C90,380 150,372 210,340 S330,300 400,250" stroke-width=".4" opacity=".3"/>
  </g>
  <g font-size="6.4" font-style="italic" font-weight="500" fill="var(--ink)" opacity=".75" text-anchor="middle">
    <text x="30" y="40">14</text><text x="96" y="52">12</text><text x="150" y="26">9</text><text x="40" y="112">7.4</text><text x="262" y="30">8</text><text x="318" y="60">4.1</text><text x="210" y="8">11</text>
    <text x="286" y="122">2.2</text><text x="346" y="96">1.6</text><text x="100" y="186">3.4</text><text x="150" y="150">2.9</text><text x="60" y="220">2.1</text><text x="240" y="92">3.8</text>
    <text x="76" y="306" text-decoration="underline">1.2</text><text x="164" y="250" text-decoration="underline">0.8</text><text x="318" y="198" text-decoration="underline">1.4</text><text x="120" y="290" text-decoration="underline">0.6</text><text x="290" y="236" text-decoration="underline">1.1</text>
  </g>
  <path d="M188,140 q-30,-46 -4,-74 q8,40 10,70 z" fill="var(--mark)" opacity=".92"/>
  <circle cx="196" cy="150" r="3" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
  <circle cx="252" cy="262" r="5" fill="none" stroke="var(--mark)" stroke-width="1.4"/>
  <circle cx="252" cy="262" r="1.6" fill="var(--mark)"/>
  <g transform="translate(58,340)" fill="none" stroke="var(--ink)" stroke-width=".6" opacity=".6"><circle r="20"/><circle r="15" stroke-dasharray=".5 2.4"/><path d="M0,-24V24M-24,0H24"/><path d="M0,-24l-3,7h6z" fill="var(--ink)"/></g>
</svg>
<div class="abs" style="left: 520px; top: 0; width: 1px; height: 800px; background: var(--ink)"></div>
<div class="title"><span class="sea" style="display: block; font-size: 22px; letter-spacing: .12em">Sample Bay</span><span class="lab" style="font-size: 9px; color: var(--ink)">Heights in metres</span></div>
<svg class="abs" style="left: 520px; bottom: 0" width="760" height="9" viewBox="0 0 760 9" id="edge"></svg>

<div class="abs wm" style="left: 40px; top: 28px"><svg viewBox="0 0 48 48"><defs><clipPath id="r"><circle cx="24" cy="24" r="21"/></clipPath></defs><path d="M-2,31 C10,11 18,11 24,24 S38,37 50,17" fill="none" stroke="currentColor" stroke-width="3.6" clip-path="url(#r)"/><circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="3.6"/><circle cx="24" cy="24" r="4.6" fill="var(--mark)"/></svg>Foreshore</div>

<div class="abs sea" style="left: 38px; top: 168px; font-size: 104px; line-height: .92; letter-spacing: -0.02em">Twice<br>a day,<br>exactly.</div>
<div class="abs" style="left: 42px; top: 478px; width: 400px; font-size: 17px; line-height: 1.5; color: var(--muted)">Foreshore draws the tide the way a chart draws a coast. One look tells you how much water you have.</div>
<div class="abs" style="left: 42px; top: 580px; display: flex; align-items: center; gap: 22px"><span class="go">Get Foreshore</span><span style="font-size: 15px; font-weight: 600; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px">See Sample Harbour today</span></div>

<div class="abs" style="left: 42px; top: 692px; display: flex; align-items: flex-end; gap: 16px">
  <span class="fig" style="font-size: 76px">14:32</span>
  <span style="padding-bottom: 2px; line-height: 1.3"><span class="sea" style="display: block; font-size: 20px">High water</span><span class="lab">Sample Harbour, 5.8 m</span></span>
</div>

<script>
const S = "http://www.w3.org/2000/svg", e = document.getElementById("edge"), w = 760 / 20;
for (let i = 0; i < 20; i += 2) { const r = document.createElementNS(S, "rect"); r.setAttribute("x", i * w); r.setAttribute("y", 0); r.setAttribute("width", w); r.setAttribute("height", 9); r.setAttribute("fill", "var(--ink)"); e.append(r); }
const o = document.createElementNS(S, "rect"); o.setAttribute("x", 0.5); o.setAttribute("y", 0.5); o.setAttribute("width", 759); o.setAttribute("height", 8); o.setAttribute("fill", "none"); o.setAttribute("stroke", "var(--ink)"); e.append(o);
// Another take of the same picture, for the "3 more" row: closer in on the pier and its light.
if (new URLSearchParams(location.search).get("tag") === "b") document.getElementById("pic").setAttribute("viewBox", "104 44 200 210");
</script>
</body>
</html>
