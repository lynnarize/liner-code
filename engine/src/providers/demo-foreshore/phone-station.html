<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foreshore, a station, phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Newsreader:ital,opsz,wght@1,6..72,300..600&display=block">
<style>
/* Foreshore: the sample tide-tables app shown inside the Liner Design mockup.
   Concept: the day is drawn the way a sea chart draws a coast. Buff land above high water,
   green foreshore that dries, blue shallows, white deep water, magenta for marks.
   On a chart the names of water slope and the names of land stand upright: so do these. */
:root{
  --paper:#F7F8F5;--ink:#11181B;--muted:#56646A;--line:rgba(17,24,27,.16);
  --shallows:#BFE0EA;--foreshore:#B5D3A0;--land:#F0DA9C;--mark:#C4127A;--tint:rgba(240,218,156,.6);--on-mark:#fff
}
.night{
  --paper:#0C1315;--ink:#E7ECE8;--muted:#8C9B9E;--line:rgba(231,236,232,.2);
  --shallows:#143A4A;--foreshore:#27452E;--land:#463C1B;--mark:#FF5FB0;--tint:rgba(70,60,27,.75);--on-mark:#0C1315
}
*{box-sizing:border-box;margin:0}
body{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);font:400 15px/1.4 "Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-kerning:normal}
svg{display:block;overflow:visible}
svg text{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums}
.abs{position:absolute}
.sea{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-0.005em}
.fig{font-style:italic;font-stretch:62%;font-weight:800;letter-spacing:-0.015em;line-height:.8;white-space:nowrap}
.t{font-style:italic;font-stretch:80%;font-weight:700;letter-spacing:-0.01em}
.lab{font-size:11px;font-weight:600;font-stretch:125%;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.mut{color:var(--muted)}
.wm{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:650;font-stretch:112%;letter-spacing:-0.025em;white-space:nowrap}
.wm svg{width:26px;height:26px}
.flag{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 9px;background:var(--mark);color:var(--on-mark);font-size:12.5px;font-weight:600;white-space:nowrap}
.flag i{font-style:italic;font-weight:500;opacity:.92}
.tabs{left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:space-around;border-top:1px solid var(--line);background:var(--paper);font-size:14px;font-weight:500;color:var(--muted)}
.tabs b{font-weight:650;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:7px}
.row{display:flex;align-items:baseline;gap:12px;height:57px;padding:17px 16px 0;border-top:1px solid var(--line)}
.row .sea{width:128px;font-size:20px}
.row .t{font-size:26px}
.row .h{margin-left:auto;font-size:15px;color:var(--muted)}
.row.hi{background:var(--tint)}
</style>
<style>
body{width:390px;height:844px}
.fact{display:flex;align-items:baseline;height:46px;padding:14px 24px 0;border-top:1px solid var(--line);font-size:15px}
.fact span{color:var(--muted)}
.fact b{margin-left:auto;font-weight:650}
.go{left:24px;right:24px;top:722px;height:50px;display:grid;place-items:center;border-radius:4px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:600}
</style>
</head>
<body>
<!-- The harbour as a chart would draw it: deep water white, shallows blue, the foreshore that dries green, land buff. -->
<svg class="abs" style="left: 0; top: 0" width="390" height="470" viewBox="0 0 390 470">
  <defs><clipPath id="c"><rect width="390" height="470"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="390" height="470" fill="var(--paper)"/>
    <path d="M-10,150 C70,150 120,70 210,60 S340,40 400,-30 L400,500 L-10,500 Z" fill="var(--shallows)"/>
    <path d="M-10,262 C70,262 128,196 208,180 S336,150 400,84 L400,500 L-10,500 Z" fill="var(--foreshore)"/>
    <path d="M-10,352 C70,352 132,300 206,280 S332,244 400,186 L400,500 L-10,500 Z" fill="var(--land)"/>
    <g fill="none" stroke="var(--ink)">
      <path d="M-10,78 C66,80 112,10 204,-6" stroke-width=".8" opacity=".35"/>
      <path d="M-10,150 C70,150 120,70 210,60 S340,40 400,-30" stroke-width=".8" opacity=".45"/>
      <path d="M-10,262 C70,262 128,196 208,180 S336,150 400,84" stroke-width=".9" stroke-dasharray="1 5" stroke-linecap="round" opacity=".7"/>
      <path d="M-10,352 C70,352 132,300 206,280 S332,244 400,186" stroke-width="2.25"/>
      <path d="M252,262 L196,150" stroke-width="5" stroke-linecap="square"/>
      <path d="M196,150 l-22,10" stroke-width="5" stroke-linecap="square"/>
    </g>
    <g font-size="11.5" font-style="italic" font-weight="500" fill="var(--ink)" opacity=".75" text-anchor="middle">
      <text x="96" y="52">12</text><text x="150" y="30">9</text><text x="40" y="112">7.4</text><text x="262" y="34">8</text><text x="318" y="62">4.1</text>
      <text x="286" y="122">2.2</text><text x="346" y="96">1.6</text>
      <text x="76" y="306" text-decoration="underline">1.2</text><text x="164" y="250" text-decoration="underline">0.8</text><text x="318" y="198" text-decoration="underline">1.4</text>
    </g>
    <path d="M188,140 q-30,-46 -4,-74 q8,40 10,70 z" fill="var(--mark)" opacity=".92"/>
    <circle cx="196" cy="150" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>
    <circle cx="252" cy="262" r="8" fill="none" stroke="var(--mark)" stroke-width="2.5"/>
    <circle cx="252" cy="262" r="2.5" fill="var(--mark)"/>
  </g>
</svg>
<div class="abs sea" style="left: 22px; top: 208px; font-size: 24px; letter-spacing: .16em; transform: rotate(-21deg); transform-origin: left top; opacity: .85">Sample Bay</div>
<div class="abs" style="left: 150px; top: 396px; font-size: 13px; font-weight: 700; font-stretch: 118%; letter-spacing: .16em; text-transform: uppercase">Sample Harbour</div>
<div class="abs lab" style="left: 270px; top: 255px; color: var(--mark)">Tide gauge</div>
<div class="abs" style="left: 20px; top: 24px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 4px; background: var(--paper)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></div>

<div class="abs" style="left: 0; right: 0; top: 470px; height: 1px; background: var(--ink)"></div>
<div class="abs" style="left: 24px; top: 490px; font-size: 34px; font-weight: 750; font-stretch: 88%; letter-spacing: -0.03em; line-height: 1">Sample Harbour</div>
<div class="abs sea" style="left: 25px; top: 530px; font-size: 18px">gauge on the old pier, drying to 1.4 m</div>
<div class="abs" style="left: 0; right: 0; top: 568px">
  <div class="fact"><span>Range today</span><b class="t" style="font-size: 18px">4.9 m</b></div>
  <div class="fact"><span>Next springs</span><b>Friday</b></div>
  <div class="fact" style="border-bottom: 1px solid var(--line)"><span>Heights above</span><b>Chart datum</b></div>
</div>
<div class="abs go">Make this my harbour</div>
<div class="abs tabs" style="height: 52px"><span>Today</span><span>Week</span><b>Stations</b></div>
</body>
</html>
