<!doctype html>
<html lang="en" data-theme="light" data-look="glass" data-blur="fake" data-accent="blue" writingsuggestions="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liner Code</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Theme and motion before first paint, so nothing flashes or moves that shouldn't.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("liner-code:look") || "{}");
          var dark = s.theme === "dark" || (s.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          var h = document.documentElement;
          h.dataset.theme = dark ? "dark" : "light";
          if (s.accent) h.dataset.accent = s.accent;
          if (s.glass) h.style.setProperty("--l-glass-opacity", s.glass);
          // Motion too (look.ts): Quick unless the look says Full.
          h.dataset.motion = s.motion === "full" ? "full" : "quick";
          // The desktop behind a see-through window (look.ts, applyLook): its tints from the first
          // frame, or the page paints its opaque ground over the clear window until the app starts.
          // Not under Reduce transparency; "Shows through" from 15% to 50%, half of it through the ground (look.ts, deskSee).
          if (s.background === "desktop" && window.linerShell && window.linerShell.clear && !matchMedia("(prefers-reduced-transparency: reduce)").matches) {
            h.dataset.bg = "desktop";
            h.style.setProperty("--lc-see", String(Math.min(0.5, Math.max(0.15, typeof s.bgShow === "number" ? s.bgShow : 0.4)) * 0.5));
            if (s.bgFrost === true) h.setAttribute("data-frost", "");
          }
        } catch (e) {}
        // The shell: Electron's preload put linerShell here; the Swift shell has a WebKit handler.
        var root = document.documentElement;
        if (window.linerShell) {
          root.dataset.shell = "electron";
          root.dataset.native = window.linerShell.platform === "darwin" ? "mac" : window.linerShell.platform;
        } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.liner) root.dataset.native = "mac";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
